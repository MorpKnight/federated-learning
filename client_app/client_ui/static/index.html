<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FL Client UI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .row { margin-bottom: 10px; }
      label { display: inline-block; width: 160px; }
      input[type="text"], input[type="number"] { width: 260px; }
      button { margin-right: 8px; }
      #logs { background: #111; color: #eee; padding: 10px; height: 240px; overflow: auto; white-space: pre-wrap; }
      .section { border: 1px solid #ddd; padding: 12px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <h1>Federated Learning Client</h1>

    <div class="section">
      <h3>Connection</h3>
      <div class="row"><label>Control API URL</label><input id="controlUrl" type="text" /></div>
      <div class="row"><label>FL Server Address</label><input id="serverAddr" type="text" /></div>
      <div class="row"><label>Client ID</label><input id="clientId" type="text" /></div>
      <button id="btnRegister">Register/Connect</button>
    </div>

    <div class="section">
      <h3>Hyperparameters</h3>
      <div class="row"><label>Mode</label>
        <select id="hpMode">
          <option value="manual">Manual</option>
          <option value="auto">Auto</option>
        </select>
      </div>
      <div class="row"><label>Batch Size</label><input id="batchSize" type="number" /></div>
      <div class="row"><label>Epochs</label><input id="epochs" type="number" /></div>
      <div class="row"><label>Learning Rate</label><input id="lr" type="text" /></div>
      <button id="btnSave">Save Config</button>
    </div>

    <div class="section">
      <h3>Training</h3>
      <button id="btnStart">Start Training</button>
      <button id="btnStop">Stop Training</button>
    </div>

    <div class="section">
      <h3>Status</h3>
      <div class="row"><label>Connected</label><span id="connected">-</span></div>
      <div class="row"><label>Running</label><span id="running">-</span></div>
      <div class="row"><label>Last Loss</label><span id="lastLoss">-</span></div>
      <div class="row"><label>Last Acc</label><span id="lastAcc">-</span></div>
      <div class="row"><label>CPU / RAM / GPU</label><span id="deviceInfo">-</span></div>
      <div class="row"><label>Dataset Samples</label><span id="datasetInfo">-</span></div>
    </div>

    <div class="section">
      <h3>Logs</h3>
      <div id="logs"></div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
